<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>原文区域复核</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:#17202b;font:14px/1.6 system-ui,sans-serif}header{padding:16px 24px;background:#172a3a;color:#fff}h1{font-size:21px;margin:0 0 5px}header p{margin:0;opacity:.85}main{display:grid;grid-template-columns:minmax(400px,1fr) 340px;gap:20px;padding:20px}.paper{position:relative;background:white;box-shadow:0 2px 10px #0002}.paper img{display:block;width:100%}.paper svg{position:absolute;inset:0;width:100%;height:100%}aside{position:sticky;top:16px;align-self:start;background:white;border-radius:8px;padding:16px;max-height:94vh;overflow:auto}label{display:block;margin:6px 0}select,input,textarea,button{font:inherit;max-width:100%}input,textarea,select{padding:5px}button{padding:6px 12px;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;background:#f4f6f8;padding:10px;font:12px/1.5 ui-monospace,monospace}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.controls label{display:inline-block}.hint{font-size:12px;color:#53616f}#detail{white-space:pre-wrap;word-break:break-word}#status{color:#9c2532}rect{vector-effect:non-scaling-stroke;cursor:pointer}rect:hover{stroke-width:3;fill-opacity:.25}h2{font-size:16px;margin:14px 0 6px}textarea{width:100%;min-height:60px}.toolbar{background:white;padding:12px;margin-bottom:12px;border-radius:8px}@media(max-width:850px){main{display:block}aside{position:static;max-height:none;margin-top:15px}}
</style>
<header><h1>原文区域复核</h1><p>查看编号、区域边界与原文；用原始文本项修正标题或公式分块。</p></header>
<main><section><div class="toolbar"><div class="controls"><label>页码 <select id="page"></select></label><label><input type="checkbox" id="text" checked>正文</label><label><input type="checkbox" id="heading" checked>标题</label><label><input type="checkbox" id="equation" checked>公式</label><label><input type="checkbox" id="review" checked>待复核</label></div><label><input type="checkbox" id="itemMode">选择原始文本项（点击选中，再次点击取消）</label><p class="hint">绿色：正文；蓝色：标题；橙色：公式；红色虚线：仅供检查的候选范围，不用于插件定位。</p></div><div class="paper"><img id="image" alt="论文原页"><svg id="overlay"></svg></div></section>
<aside><h2>当前区域</h2><div id="detail">点击页面中的边框查看编号和原文。</div><h2>保存复核区域</h2><p class="hint">先切换到“选择原始文本项”。只选择同一公式或标题的文字，包括公式编号和上下标。坐标由程序计算。</p><pre id="selection">尚未选择</pre><label>类型 <select id="kind"><option value="equation">公式</option><option value="heading">标题</option></select></label><label>公式编号 <input id="label" placeholder="例如 2"></label><label>记录名称 <input id="key" placeholder="例如 page-4-equation-2"></label><label>核对说明<textarea id="note" placeholder="说明已对照原图确认的边界"></textarea></label><button id="add">加入复核记录</button> <button id="clear">清空选择</button><p id="status" role="status"></p><h2>待导出的记录</h2><div id="records"></div><button id="download">下载 layout-overrides.json</button><p class="hint">保存到论文目录的 .translation/layout-overrides.json 后重新生成 layout 草稿。已有译文须使用 migrate-layout --preserve-ids，核对后再 --apply。</p></aside></main>
<script type="application/json" id="data">__REVIEW_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg';
let chosen=new Set();const records=data.overrides.regions;
for(const p of data.pages){const option=document.createElement('option');option.value=p.number;option.textContent=p.number;$('page').append(option);}
const current=()=>data.pages.find(p=>p.number===Number($('page').value));
function selection(){const p=current();$('selection').textContent=chosen.size?'第 '+p.number+' 页 · items: '+[...chosen].sort((a,b)=>a-b).join(', ')+'\n'+p.items.filter(i=>chosen.has(i.index)).map(i=>i.text).join(' '):'尚未选择';}
function draw(){const p=current();$('image').src=p.image;$('overlay').setAttribute('viewBox','0 0 '+p.width+' '+p.height);$('overlay').replaceChildren();
 const itemMode=$('itemMode').checked;
 const units=itemMode?p.items.map(i=>({id:String(i.index),source:i.text,items:[i.index],kind:'item',rects:[i.rect],needsReview:i.geometryIssue})):p.segments.filter(s=>$(s.kind)?.checked&&(!s.needsReview||$('review').checked));
 for(const s of units)for(const r of s.rects){const node=document.createElementNS(ns,'rect');['x','y','width','height'].forEach((k,i)=>node.setAttribute(k,r[i]));const color=itemMode?(chosen.has(s.items[0])?'#c33f90':'#46697d'):s.needsReview?'#bc2838':s.kind==='equation'?'#ca6400':s.kind==='heading'?'#1762bc':'#228066';node.setAttribute('stroke',color);node.setAttribute('fill',color);node.setAttribute('fill-opacity',itemMode&&chosen.has(s.items[0])?'.3':'.035');node.setAttribute('stroke-width',s.kind==='text'?'1':'1.7');if(s.needsReview)node.setAttribute('stroke-dasharray','5 3');const title=document.createElementNS(ns,'title');title.textContent=s.id+' '+s.source;node.append(title);node.addEventListener('click',()=>{if(itemMode){const id=s.items[0];chosen.has(id)?chosen.delete(id):chosen.add(id);selection();draw();}else{$('detail').textContent=s.id+' · '+s.kind+(s.label?' ('+s.label+')':'')+'\n'+(s.needsReview?'待复核：'+s.needsReview:s.reviewed?'已人工复核':'自动生成')+'\nitems: '+s.items.join(', ')+'\n\n'+s.source;}});$('overlay').append(node);}}
function list(){$('records').replaceChildren();for(const r of records){const line=document.createElement('p'),remove=document.createElement('button');line.textContent=r.key+' · 第 '+r.page+' 页 · '+r.items.length+' 项 ';remove.textContent='移除';remove.onclick=()=>{records.splice(records.indexOf(r),1);list();};line.append(remove);$('records').append(line);}}
$('add').onclick=()=>{const key=$('key').value.trim(),note=$('note').value.trim(),page=current().number,items=[...chosen].sort((a,b)=>a-b);if(!key||!note||!items.length){$('status').textContent='请填写记录名称、核对说明，并选择文本项。';return;}if(records.some(r=>r.key===key||r.page===page&&r.items.some(i=>chosen.has(i)))){$('status').textContent='名称或文本项与已有记录重复，请先移除对应记录。';return;}records.push({key,page,kind:$('kind').value,...($('label').value.trim()?{label:$('label').value.trim()}:{}),items,reviewed:true,note});chosen.clear();$('status').textContent='已加入；下载后由命令检查是否完整覆盖被替换区域。';list();selection();draw();};
$('clear').onclick=()=>{chosen.clear();selection();draw();};$('page').onchange=()=>{chosen.clear();selection();draw();};for(const id of ['text','heading','equation','review','itemMode'])$(id).onchange=draw;
$('download').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({...data.overrides,regions:records},null,2)+'\n'],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='layout-overrides.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};list();draw();
</script></html>
